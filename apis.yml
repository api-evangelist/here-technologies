aid: here-technologies
url: https://raw.githubusercontent.com/api-evangelist/here-technologies/refs/heads/main/apis.yml
name: HERE Technologies
kind: company
description: >-
  HERE Technologies is a location data and technology company offering a broad
  REST API surface for mapping, geocoding, search, routing, fleet planning,
  traffic, weather, transit, geofencing, tracking, and HD live mapping for
  automated driving, plus client SDKs (Maps API for JavaScript, native SDKs
  for iOS and Android, Flutter), HERE Studio and Workspace for data hosting,
  and HERE Platform for enterprise data ingestion and processing. Most
  Location Services APIs are served under the *.hereapi.com domain and
  authenticated by API key, OAuth token, or app id / app code.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Maps
  - Geocoding
  - Routing
  - Location Services
  - Traffic
  - HD Live Map
  - Automotive
  - Fleet
created: '2026-05-23'
modified: '2026-05-23'
specificationVersion: '0.19'
